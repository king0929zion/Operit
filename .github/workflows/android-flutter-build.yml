name: Android Flutter Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Android NDK
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/operit-android-runtime
          key: android-ndk-r29-beta4

      - name: Cache runtime sources
        id: runtime-sources
        uses: actions/cache@v4
        with:
          path: |
            tools/android-runtime/downloads
            tools/android-runtime/sources
          key: android-runtime-sources-${{ hashFiles('tools/android-runtime/fetch_sources.ps1') }}

      - name: Cache built runtime outputs
        id: runtime-outputs
        uses: actions/cache@v4
        with:
          path: |
            apps/flutter/app/android/app/src/main/jniLibs
            apps/flutter/app/android/app/src/main/assets/android-runtime
          key: android-runtime-built-${{ hashFiles('tools/android-runtime/fetch_sources.ps1', 'tools/android-runtime/*.sh') }}

      - name: Install Android runtime build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison \
            build-essential \
            bzip2 \
            ca-certificates \
            curl \
            diffutils \
            flex \
            gawk \
            gzip \
            patch \
            pkg-config \
            tar \
            unzip \
            xz-utils

      - name: Fetch Android runtime sources
        if: steps.runtime-outputs.outputs.cache-hit != 'true' && steps.runtime-sources.outputs.cache-hit != 'true'
        shell: pwsh
        run: pwsh -NoProfile -File tools/android-runtime/fetch_sources.ps1

      - name: Fetch Android NDK
        if: steps.runtime-outputs.outputs.cache-hit != 'true' && steps.ndk-cache.outputs.cache-hit != 'true'
        run: bash tools/android-runtime/fetch_ndk_wsl.sh

      - name: Build Android terminal runtime
        if: steps.runtime-outputs.outputs.cache-hit != 'true'
        run: |
          export ANDROID_NDK_HOME="$HOME/.cache/operit-android-runtime/android-ndk-r29-beta4"
          bash tools/android-runtime/build_android_tools_wsl.sh
          bash tools/android-runtime/build_alpine_rootfs_wsl.sh

      - name: Upload Android terminal runtime
        uses: actions/upload-artifact@v4
        with:
          name: operit2-android-runtime-${{ github.sha }}
          path: |
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/libbash.so
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/liboperit_busybox.so
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/liboperit_loader.so
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/liboperit_proot.so
            apps/flutter/app/android/app/src/main/assets/android-runtime/arm64-v8a/rootfs.tar.gz.bin
            apps/flutter/app/android/app/src/main/assets/android-runtime/arm64-v8a/rootfs.tar.gz.bin.sha256
          if-no-files-found: error
          retention-days: 1

  build-android:
    needs: build-android-runtime
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      RUSTFLAGS: -Awarnings
      RUST_TOOLCHAIN_VERSION: 1.95.0
      FVM_VERSION: 4.3.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Android terminal runtime
        uses: actions/download-artifact@v4
        with:
          name: operit2-android-runtime-${{ github.sha }}
          path: apps/flutter/app/android/app/src/main

      - name: Cache FVM Flutter SDK
        uses: actions/cache@v4
        with:
          path: ~/fvm
          key: fvm-sdk-${{ hashFiles('apps/flutter/app/.fvmrc') }}

      - name: Cache Dart pub packages
        uses: actions/cache@v4
        with:
          path: ~/AppData/Roaming/Pub/Cache
          key: pub-cache-${{ hashFiles('apps/flutter/app/pubspec.lock') }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('apps/flutter/app/android/gradle/wrapper/gradle-wrapper.properties', 'apps/flutter/app/android/settings.gradle.kts', 'apps/flutter/app/pubspec.lock') }}

      - name: Cache bindgen libclang
        id: libclang-cache
        uses: actions/cache@v4
        with:
          path: target/operit-build-tools
          key: libclang-win-x64-21.1.8

      - name: Install bootstrap Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.5

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack pnpm shims
        shell: pwsh
        run: |
          corepack enable
          corepack pnpm --version

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install FVM
        shell: pwsh
        run: |
          dart pub global activate fvm $env:FVM_VERSION
          "$env:APPDATA\Pub\Cache\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install project Flutter SDK
        working-directory: apps/flutter/app
        shell: pwsh
        run: fvm install --skip-pub-get

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: aarch64-linux-android

      - name: Cache Rust bridge build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/flutter/native/operit-flutter-bridge -> target
            core -> target
          cache-provider: github

      # rust-cache restores bridge/target/, so cargo would skip the
      # proxy/local build script entirely — but that script is what writes
      # the generated Dart proxy files. Force it to rerun.
      - name: Force proxy codegen rerun
        shell: pwsh
        run: cargo clean --manifest-path apps/flutter/native/operit-flutter-bridge/Cargo.toml -p operit-proxy-local

      # Deterministic codegen: same command as the diagnose job (proven to
      # emit all types). Must run before the Flutter build, never as a
      # side effect of the Gradle cargo build.
      - name: Regenerate Dart proxy
        shell: pwsh
        run: |
          cargo clean --manifest-path core/Cargo.toml -p operit-proxy-local
          cargo check --manifest-path core/crates/proxy/local/Cargo.toml
          Get-ChildItem apps/flutter/app/lib/core/proxy/generated/

      - name: Prepare Android bindgen libclang
        if: steps.libclang-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $version = "21.1.8"
          $packageName = "libclang.runtime.win-x64.$version"
          $toolsDir = "target/operit-build-tools"
          $packageDir = Join-Path $toolsDir $packageName
          $archive = Join-Path $toolsDir "$packageName.nupkg"
          New-Item -ItemType Directory -Force -Path $toolsDir | Out-Null
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/libclang.runtime.win-x64/$version" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $packageDir -Force
          $libclang = Join-Path $packageDir "runtimes/win-x64/native/libclang.dll"
          if (-not (Test-Path -LiteralPath $libclang)) {
            throw "Android bindgen libclang was not prepared at $libclang"
          }

      - name: Restore Android signing material
        shell: pwsh
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          $required = @(
            "ANDROID_RELEASE_KEYSTORE_BASE64",
            "ANDROID_RELEASE_STORE_PASSWORD",
            "ANDROID_RELEASE_KEY_ALIAS",
            "ANDROID_RELEASE_KEY_PASSWORD"
          )
          $missing = $required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missing.Count -gt 0) {
            throw "Missing required GitHub Actions secrets: $($missing -join ', ')"
          }
          $secretsDir = "tools/release/secrets"
          New-Item -ItemType Directory -Force -Path $secretsDir | Out-Null
          $keystore = Join-Path $secretsDir "operit2-release.keystore"
          [System.IO.File]::WriteAllBytes($keystore, [System.Convert]::FromBase64String($env:ANDROID_RELEASE_KEYSTORE_BASE64))
          @"
          RELEASE_STORE_FILE=operit2-release.keystore
          RELEASE_STORE_PASSWORD=$env:ANDROID_RELEASE_STORE_PASSWORD
          RELEASE_KEY_ALIAS=$env:ANDROID_RELEASE_KEY_ALIAS
          RELEASE_KEY_PASSWORD=$env:ANDROID_RELEASE_KEY_PASSWORD
          "@ | Set-Content -Path (Join-Path $secretsDir "android-signing.properties") -Encoding utf8

      - name: Check build environment
        shell: pwsh
        run: python tools/build_scripts/check_environment.py --products app --github-runner

      - name: Build and package Android app
        shell: pwsh
        run: |
          $version = (Select-String -Path apps/flutter/app/pubspec.yaml -Pattern '^version:\s*(\d+\.\d+\.\d+)\+(\d+)\s*$').Matches
          if ($version.Count -ne 1) {
            throw "apps/flutter/app/pubspec.yaml must contain exactly one release version line"
          }
          python tools/build_scripts/build_flutter_android.py --build-name $version[0].Groups[1].Value --build-number $version[0].Groups[2].Value --enforce-lockfile

      - name: Dump generated Dart proxy surface
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          Write-Host "PWD=$(Get-Location)"
          Get-ChildItem apps/flutter/app/lib/core/proxy -Recurse -ErrorAction SilentlyContinue | Format-Table Name, Length
          $gen = "apps/flutter/app/lib/core/proxy/generated"
          if (-not (Test-Path -LiteralPath $gen)) {
            Write-Host "generated dir MISSING (codegen never ran)"
            exit 0
          }
          foreach ($f in @("CoreProxyModels.g.dart", "CoreProxyClients.g.dart")) {
            $p = Join-Path $gen $f
            if (Test-Path -LiteralPath $p) {
              Write-Host "$f bytes=$((Get-Item -LiteralPath $p).Length)"
            } else {
              Write-Host "$f MISSING"
            }
          }
          foreach ($t in @("NetworkControlState","RuntimeDeviceSpaceDevice","RuntimeDeviceSpaceTopology","NetworkControlRole","NetworkControlAuditRecord","NetworkControlIdentityAssignment","RuntimePairedDeviceStatus","LinkAccessHostPortMode")) {
            $c = (Select-String -Path (Join-Path $gen "CoreProxyModels.g.dart") -Pattern "(class|enum) $t\b" -ErrorAction SilentlyContinue | Measure-Object).Count
            Write-Host "model $t decls=$c"
          }
          foreach ($m in @("deviceSpaceControl","deviceSpaceTopology","pairedDeviceStatus","admitDeviceSpaceMember","initializeHostConfig","deviceSpaceControlAudit")) {
            $c = (Select-String -Path (Join-Path $gen "CoreProxyClients.g.dart") -Pattern "$m\s*\(" -ErrorAction SilentlyContinue | Measure-Object).Count
            Write-Host "client $m defs=$c"
          }

      - name: Upload generated proxy for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operit2-dart-proxy-${{ github.sha }}
          path: apps/flutter/app/lib/core/proxy/generated/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: operit2-android-${{ github.sha }}
          path: tools/release/dist/operit2-app-android-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 14

  publish-release:
    needs: build-android
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: operit2-android-${{ github.sha }}
          path: dist-apk

      - name: Read app version
        id: version
        shell: bash
        run: |
          VER=$(grep -E '^version:' apps/flutter/app/pubspec.yaml | sed -E 's/^version:[[:space:]]*//')
          echo "app_version=$VER" >> "$GITHUB_OUTPUT"
          echo "App version: $VER"
          ls -lh dist-apk/

      - name: Publish to android-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Android latest ${{ steps.version.outputs.app_version }}
          prerelease: true
          generate_release_notes: false
          body: |
            Operit Android 最新签名构建

            - App 版本: ${{ steps.version.outputs.app_version }}
            - Commit: ${{ github.sha }}
            - 构建: Android Flutter Build #${{ github.run_number }}
            - APK: operit2-app-android-arm64-v8a.apk（arm64-v8a, release 签名）

            下载后直接安装。更新下载页版本请同步 `site/version.json` 与 `apps/flutter/app/pubspec.yaml`。
          files: dist-apk/operit2-app-android-arm64-v8a.apk

  # Fast codegen truth: runs the Dart proxy generator on Linux without the
  # full Flutter/Android toolchain, so missing-type root causes arrive in
  # minutes instead of one 20-minute Android cycle.
  diagnose-proxy-codegen:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RUST_TOOLCHAIN_VERSION: 1.95.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}

      - name: Run Dart proxy codegen
        run: cargo check --manifest-path core/crates/proxy/local/Cargo.toml

      - name: Dump proxy surface
        if: always()
        run: |
          gen=apps/flutter/app/lib/core/proxy/generated
          ls -la "$gen" || echo "GENERATED DIR MISSING"
          for f in CoreProxyModels.g.dart CoreProxyClients.g.dart; do
            if [ -f "$gen/$f" ]; then wc -c "$gen/$f"; else echo "$f MISSING"; fi
          done
          for t in NetworkControlState RuntimeDeviceSpaceDevice RuntimeDeviceSpaceTopology NetworkControlRole NetworkControlAuditRecord NetworkControlIdentityAssignment RuntimePairedDeviceStatus LinkAccessHostPortMode CoreSpace GeneratedCoreProxyClients; do
            echo "model $t decls=$(grep -cE "(class|enum) $t" "$gen/CoreProxyModels.g.dart" || true)"
          done
          for m in deviceSpaceControl deviceSpaceTopology pairedDeviceStatus admitDeviceSpaceMember initializeHostConfig deviceSpaceControlAudit deviceSpace; do
            echo "client $m refs=$(grep -cE "$m\\s*\\(" "$gen/CoreProxyClients.g.dart" || true)"
          done

      - name: Upload generated proxy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operit2-dart-proxy-diag-${{ github.sha }}
          path: apps/flutter/app/lib/core/proxy/generated/
          if-no-files-found: warn
          retention-days: 7
